# Sensitive Data Detector Registry
# Declarative, configurable detectors for PII and sensitive data.
# Supports pattern regex, mathematical checksum validation, and surrounding context cues.

version: "2.1.0"

detectors:
  ssn:
    name: "Social Security Number"
    type: "US_SSN"
    category: "PII"
    sensitivity: "high"
    pattern: "\\b(?!000|666|9\\d{2})\\d{3}[- ](?!00)\\d{2}[- ](?!0000)\\d{4}\\b"
    checksum: "none"
    positive_context:
      - "ssn"
      - "social security"
      - "social sec"
      - "taxpayer id"
      - "tin"
    negative_context:
      - "part number"
      - "serial"
      - "order"
      - "sku"
      - "tracking"
      - "phone"
    base_confidence: 0.88
    context_boost: 0.10
    contradiction_penalty: 0.40
    mask_format: "***-**-{last4}"

  credit_card:
    name: "Payment Card Number"
    type: "CREDIT_CARD"
    category: "Financial"
    sensitivity: "high"
    pattern: "\\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|3(?:0[0-5]|[68][0-9])[0-9]{11}|6(?:011|5[0-9]{2})[0-9]{12}|(?:2131|1800|35\\d{3})\\d{11})\\b"
    checksum: "luhn"
    positive_context:
      - "card"
      - "credit card"
      - "visa"
      - "mastercard"
      - "amex"
      - "payment"
      - "cc"
    negative_context:
      - "account"
      - "routing"
      - "invoice"
      - "po number"
    base_confidence: 0.90
    context_boost: 0.08
    contradiction_penalty: 0.45
    mask_format: "****-****-****-{last4}"

  iban:
    name: "International Bank Account Number"
    type: "IBAN"
    category: "Financial"
    sensitivity: "high"
    pattern: "\\b[A-Z]{2}\\d{2}[A-Z0-9]{11,30}\\b"
    checksum: "mod97"
    positive_context:
      - "iban"
      - "bank account"
      - "account number"
      - "wire"
      - "swift"
    negative_context:
      - "hash"
      - "token"
      - "key"
    base_confidence: 0.85
    context_boost: 0.12
    contradiction_penalty: 0.35
    mask_format: "{first4} **** **** {last4}"

  aadhaar:
    name: "Aadhaar Identity Number"
    type: "AADHAAR"
    category: "PII"
    sensitivity: "high"
    pattern: "\\b[2-9]\\d{3}\\s?\\d{4}\\s?\\d{4}\\b"
    checksum: "verhoeff"
    positive_context:
      - "aadhaar"
      - "aadhar"
      - "uid"
      - "unique identification"
    negative_context:
      - "account"
      - "phone"
      - "serial"
    base_confidence: 0.85
    context_boost: 0.12
    contradiction_penalty: 0.40
    mask_format: "XXXX XXXX {last4}"

  pan:
    name: "Permanent Account Number"
    type: "PAN"
    category: "PII"
    sensitivity: "high"
    pattern: "\\b[A-Z]{5}[0-9]{4}[A-Z]\\b"
    checksum: "none"
    positive_context:
      - "pan"
      - "permanent account"
      - "income tax"
      - "tax id"
    negative_context:
      - "postal"
      - "zip"
      - "code"
    base_confidence: 0.82
    context_boost: 0.15
    contradiction_penalty: 0.35
    mask_format: "*****{last4}"

  passport:
    name: "Passport Number"
    type: "PASSPORT"
    category: "PII"
    sensitivity: "high"
    pattern: "\\b[A-Z]{1,2}[0-9]{7,9}\\b"
    checksum: "none"
    positive_context:
      - "passport"
      - "travel document"
      - "citizenship"
      - "nationality"
    negative_context:
      - "invoice"
      - "order"
      - "part"
    base_confidence: 0.80
    context_boost: 0.15
    contradiction_penalty: 0.40
    mask_format: "[RESTRICTED PASSPORT]"

  email:
    name: "Email Address"
    type: "EMAIL"
    category: "Contact"
    sensitivity: "medium"
    pattern: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
    checksum: "none"
    positive_context:
      - "email"
      - "e-mail"
      - "contact"
      - "mail to"
    negative_context: []
    base_confidence: 0.95
    context_boost: 0.03
    contradiction_penalty: 0.0
    mask_format: "{user_initial}***@{domain}"

  phone:
    name: "Telephone Number"
    type: "PHONE_NUMBER"
    category: "Contact"
    sensitivity: "medium"
    pattern: "\\b(?:\\+?\\d{1,3}[-.\\s]?)?\\(?\\d{3}\\)?[-.\\s]?\\d{3}[-.\\s]?\\d{4}\\b"
    checksum: "none"
    positive_context:
      - "phone"
      - "tel"
      - "mobile"
      - "cell"
      - "contact"
      - "fax"
    negative_context:
      - "date"
      - "amount"
      - "price"
      - "ssn"
    base_confidence: 0.85
    context_boost: 0.10
    contradiction_penalty: 0.30
    mask_format: "***-***-{last4}"

  medical_record_id:
    name: "Medical Record Identifier"
    type: "HEALTH_IDENTIFIER"
    category: "Health"
    sensitivity: "high"
    pattern: "\\b(?:MRN|PAT|MED|HLTH)[-#\\s]?[A-Z0-9]{6,12}\\b"
    checksum: "none"
    positive_context:
      - "patient"
      - "mrn"
      - "medical record"
      - "health id"
      - "clinical"
      - "hospital"
    negative_context:
      - "tracking"
      - "shipping"
    base_confidence: 0.90
    context_boost: 0.08
    contradiction_penalty: 0.40
    mask_format: "[RESTRICTED MEDICAL ID]"

  person_name:
    name: "Individual Full Name"
    type: "PERSON_NAME"
    category: "PII"
    sensitivity: "medium"
    pattern: "\\b(?:Mr\\.?|Mrs\\.?|Ms\\.?|Dr\\.?|Prof\\.?)\\s+[A-Z][a-z]+(?:\\s+[A-Z][a-z]+)+\\b"
    checksum: "none"
    positive_context:
      - "name"
      - "patient"
      - "employee"
      - "client"
      - "customer"
      - "signatory"
      - "contact"
      - "physician"
    negative_context:
      - "company"
      - "organization"
      - "vendor"
      - "store"
    base_confidence: 0.85
    context_boost: 0.10
    contradiction_penalty: 0.35
    mask_format: "{user_initial}*** [PERSON]"

  physical_address:
    name: "Street / Residential Address"
    type: "ADDRESS"
    category: "PII"
    sensitivity: "medium"
    pattern: "\\b\\d{1,5}[ \\t]+[A-Za-z0-9.-]+(?:[ \\t]+[A-Za-z0-9.-]+){0,4}[ \\t]+(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Drive|Dr|Lane|Ln|Way|Highway|Hwy|Court|Ct|Plaza|Plz)\\b"
    checksum: "none"
    positive_context:
      - "address"
      - "residence"
      - "residential"
      - "billing address"
      - "shipping address"
      - "street"
    negative_context:
      - "email"
      - "url"
      - "website"
    base_confidence: 0.82
    context_boost: 0.12
    contradiction_penalty: 0.35
    mask_format: "[RESTRICTED ADDRESS]"
